server:
  port: 9285

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

frontend:
  url: http://localhost:9286

aws:
  region: ${AWS_REGION:eu-north-1}
  endpoint: ${AWS_ENDPOINT:http://localhost:4567}
  accessKey: ${AWS_ACCESS_KEY}
  secretKey: ${AWS_SECRET_KEY}
  s3bucket: image-warehouse